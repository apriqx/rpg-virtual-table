services:
  - type: web
    name: rpg-vtable-api
    runtime: node
    repo: https://github.com/seu-usuario/rpg-virtual-table
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rpg-vtable-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads

  - type: web
    name: rpg-vtable-frontend
    repo: https://github.com/seu-usuario/rpg-virtual-table
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDirectory: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: rpg-vtable-api
          type: web
          property: host

  - type: psql
    name: rpg-vtable-db
    databaseName: rpg_virtual_table
    plan: free
    ipAllowList: []